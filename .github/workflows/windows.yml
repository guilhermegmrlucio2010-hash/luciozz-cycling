name: Criar aplicação Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run tauri build
        env:
          VITE_SUPABASE_URL: https://kxiegplvxkncrmzwayfo.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_dKn8YjzUEdTwuc4orwQ0EQ_9iCGwNf5
      - uses: actions/upload-artifact@v4
        with:
          name: luciozz-cycling-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
